services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  nextjs:
    build: .
    container_name: nextjs_app
    restart: always
    env_file:
      - ./.env.docker
    depends_on:
      - db
    ports:
      - "3000:3000"

volumes:
  postgres_data:
